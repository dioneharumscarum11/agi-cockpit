name: Bug report
description: Report a reproducible problem in AGI Cockpit
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AGI Cockpit. Do not include credentials, tokens, private source code, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: AGI Cockpit version
      placeholder: 4.39.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, what you expected, and the steps needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Add screenshots or sanitized logs if they help. Remove private paths and secrets first.
    validations:
      required: false
