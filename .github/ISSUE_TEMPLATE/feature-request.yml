name: Feature request
description: Suggest an improvement to AGI Cockpit
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or limitation rather than only the proposed feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the result you would like and any alternatives you have tried.
    validations:
      required: true
